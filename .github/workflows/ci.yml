name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Import smoke test
        run: uv run python -c "import minne, minne.cli, minne.clip, minne.copilot, minne.reader, minne.render, minne.repo, minne.summarize"

      - name: CLI help
        run: uv run minne --help
