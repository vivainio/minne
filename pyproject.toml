[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minne"
version = "0.0.0.dev"
description = "Agent memory system for Claude Code."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
minne = "minne.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["minne"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Long lines inside the Haiku prompt and argparse help text are
# intentional — wrapping them changes user-facing output.
"minne/summarize.py" = ["E501"]
"minne/cli.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
